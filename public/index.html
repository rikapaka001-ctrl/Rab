<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIKA XMD FREE BOT</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#020202;
    --surface:rgba(10,10,10,0.7);
    --border:rgba(0,255,255,0.12);
    --neon:#00f2ff;
    --purple:#8c00ff;
    --text:#ffffff;
    --muted:#8a8a8a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
    radial-gradient(circle at top left, rgba(0,255,255,0.08), transparent 25%),
    radial-gradient(circle at bottom right, rgba(140,0,255,0.10), transparent 30%),
    linear-gradient(135deg,#000000,#050505,#000000);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
    linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px);
    background-size:40px 40px;
    animation:gridMove 15s linear infinite;
    z-index:-3;
}

@keyframes gridMove{
    from{transform:translateY(0px);}
    to{transform:translateY(40px);}
}

.bg-animate{
    position:fixed;
    inset:0;
    z-index:-2;
}

.blob{
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(0,255,255,0.22), transparent 70%);
    filter:blur(90px);
    animation:floatBlob 18s infinite alternate ease-in-out;
}

.blob:nth-child(2){
    background:radial-gradient(circle, rgba(140,0,255,0.22), transparent 70%);
    top:50%;
    left:60%;
    animation-duration:24s;
}

@keyframes floatBlob{
    from{
        transform:translate(-10%,-10%) scale(1);
    }
    to{
        transform:translate(20%,20%) scale(1.3);
    }
}

.container{
    width:100%;
    max-width:420px;
    padding:20px;
    z-index:10;
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.brand{
    text-align:center;
    margin-bottom:35px;
}

.brand h1{
    font-family:'JetBrains Mono',monospace;
    font-size:2.1rem;
    letter-spacing:7px;
    color:var(--neon);
    text-shadow:
    0 0 10px rgba(0,255,255,0.8),
    0 0 25px rgba(0,255,255,0.5),
    0 0 50px rgba(0,255,255,0.3);
    animation:glowPulse 2s infinite alternate;
}

@keyframes glowPulse{
    from{
        text-shadow:
        0 0 10px rgba(0,255,255,0.7),
        0 0 20px rgba(0,255,255,0.4);
    }
    to{
        text-shadow:
        0 0 20px rgba(0,255,255,1),
        0 0 40px rgba(0,255,255,0.8),
        0 0 80px rgba(0,255,255,0.4);
    }
}

.subtext{
    margin-top:12px;
    font-size:0.7rem;
    letter-spacing:4px;
    color:var(--muted);
}

.card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:24px;
    padding:35px 28px;
    backdrop-filter:blur(20px);
    box-shadow:
    0 0 30px rgba(0,255,255,0.08),
    0 0 80px rgba(0,0,0,0.9);
    position:relative;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:24px;
    padding:1px;
    background:linear-gradient(135deg, rgba(0,255,255,0.5), rgba(140,0,255,0.3), transparent);
    -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
}

.label{
    display:block;
    margin-bottom:18px;
    color:var(--neon);
    font-family:'JetBrains Mono',monospace;
    font-size:0.8rem;
    letter-spacing:2px;
}

input{
    width:100%;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(0,255,255,0.1);
    border-radius:14px;
    padding:18px;
    color:#fff;
    font-size:1.1rem;
    outline:none;
    transition:0.3s;
    font-family:'JetBrains Mono',monospace;
}

input:focus{
    border-color:var(--neon);
    box-shadow:0 0 20px rgba(0,255,255,0.2);
}

.btn{
    width:100%;
    margin-top:22px;
    background:linear-gradient(135deg,#00f2ff,#00bfff);
    border:none;
    border-radius:14px;
    padding:18px;
    color:#000;
    font-weight:800;
    letter-spacing:2px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 20px rgba(0,255,255,0.3);
}

.btn:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:
    0 0 30px rgba(0,255,255,0.6),
    0 10px 40px rgba(0,255,255,0.2);
}

.result{
    margin-top:25px;
    display:none;
}

.result.show{
    display:block;
}

.code-display{
    background:rgba(0,255,255,0.05);
    border:1px dashed var(--neon);
    border-radius:15px;
    padding:25px;
    text-align:center;
}

.code-text{
    font-family:'JetBrains Mono',monospace;
    font-size:2rem;
    letter-spacing:8px;
    color:var(--neon);
}

.copy-link{
    margin-top:15px;
    color:var(--muted);
    cursor:pointer;
    font-size:0.8rem;
}

.footer{
    margin-top:35px;
    text-align:center;
    color:var(--muted);
    letter-spacing:4px;
    font-size:0.65rem;
}

.floating-controls{
    position:fixed;
    top:20px;
    right:20px;
    display:flex;
    gap:12px;
    z-index:999;
}

.f-btn{
    background:rgba(15,15,15,0.7);
    border:1px solid rgba(0,255,255,0.1);
    color:#fff;
    padding:12px 16px;
    border-radius:50px;
    cursor:pointer;
    backdrop-filter:blur(10px);
    transition:0.3s;
}

.f-btn:hover{
    border-color:var(--neon);
    color:var(--neon);
}

@media(max-width:480px){
    .brand h1{
        font-size:1.6rem;
        letter-spacing:5px;
    }

    .card{
        padding:28px 20px;
    }
}
</style>
</head>
<body>

<div class="bg-animate">
    <div class="blob"></div>
    <div class="blob"></div>
</div>

<div class="floating-controls">
    <button class="f-btn" onclick="toggleMusic()" id="mBtn">MUSIC OFF 🎵</button>
</div>

<audio id="bgMusic" loop>
    <source src="https://files.catbox.moe/srf3p5.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <div class="brand">
        <h1>𝐑𝐈𝐊𝐀 𝐗𝐌𝐃 𝐅𝐑𝐄𝐄 𝐁𝐎𝐓</h1>
        <div class="subtext"> 𝐑ɪᴋᴀ ᴛᴇᴀᴄʜ ꜰʀᴇᴇ ʙᴏᴛ🚶‍♂️</div>
    </div>

    <div class="card">

        <label class="label">01. ENTER PHONE NUMBER</label>

        <input type="tel" id="phoneInput" placeholder="94766619###">

        <button class="btn" onclick="getPairingCode()" id="pairBtn">
            <span id="btnText">𝐆ᴇᴛ ᴘᴀɪʀɪɴɢ ᴄᴏᴅᴇ</span>
        </button>

        <div class="result" id="result"></div>

    </div>

    <div class="footer">
        POWERED BY SHAMIKA DENUWAN
    </div>

</div>

<script>
async function getPairingCode(){

    const input=document.getElementById('phoneInput');
    const number=input.value.trim().replace(/[^0-9]/g,'');

    const btn=document.getElementById('pairBtn');
    const btnText=document.getElementById('btnText');
    const result=document.getElementById('result');

    if(number.length<7){
        showError('INVALID NUMBER');
        return;
    }

    btn.disabled=true;
    btnText.innerHTML='LOADING...';

    try{

        const response=await fetch(`/pair?number=${number}`);
        const data=await response.json();

        if(data.code){
            showCode(data.code);
        }else{
            showError(data.error || 'SERVER ERROR');
        }

    }catch(err){
        showError('SERVER OFFLINE');
    }

    btn.disabled=false;
    btnText.innerHTML='GET PAIRING CODE';
}

function showCode(code){

    const result=document.getElementById('result');

    result.innerHTML=`
    <div class="code-display">
        <div class="code-text">${code}</div>
        <div class="copy-link" onclick="copyCode('${code}')">CLICK TO COPY</div>
    </div>
    `;

    result.classList.add('show');
}

function showError(msg){

    const result=document.getElementById('result');

    result.innerHTML=`
    <div style="padding:12px;border-radius:10px;background:rgba(255,0,0,0.08);border:1px solid red;text-align:center;color:red;">
        ${msg}
    </div>
    `;

    result.classList.add('show');
}

function copyCode(code){

    navigator.clipboard.writeText(code);

    const link=document.querySelector('.copy-link');

    link.innerText='COPIED SUCCESSFULLY';

    setTimeout(()=>{
        link.innerText='CLICK TO COPY';
    },2000);
}

let isPlaying=false;
const music=document.getElementById('bgMusic');

function toggleMusic(){

    if(isPlaying){
        music.pause();
        document.getElementById('mBtn').innerText='MUSIC OFF 🎵';
    }else{
        music.play();
        document.getElementById('mBtn').innerText='MUSIC ON 🔊';
    }

    isPlaying=!isPlaying;
}
</script>

</body>
    </html>
